n;gap:5px;justify-content:center;padding:7px 5px;border-radius:7px}.mobile-nav .nav-btn svg{width:18px;height:18px}.mobile-nav .nav-name{font-size:8px;letter-spacing:.03em}.mobile-nav .nav-key{display:none}.mobile-nav .nav-btn.active:before{left:12px;right:12px;top:-7px;bottom:auto;width:auto;height:2px}.toast-stack{top:70px;right:12px}.boot-logo{font-size:25px}}

<body>

  (()=>{

1Z"/><path d="m9 12 2 2 4-4"/>',memory:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9zM9 1v3m6-3v3M9 20v3m6-3v3M1 9h3m-3 6h3m16-6h3m-3 6h3"/>',harddrive:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18m-13 3h.01m4-.01h.01"/>',alert:'<path d="M10.3 3.9 1.8 18.2A2 2 0 0 0 3.5 21h17a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 4h.01"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',zap:'<path d="m13 2-3 8H4l7 12 3-8h6L13 2Z"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8m-8 4h8"/>'};
    const icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.activity}</svg>`;
    $('#brandMark').innerHTML=icon('logo',23);$('#mobileMark').innerHTML=icon('logo',18);$('#quickTerminal').innerHTML=icon('terminal',17);
    const pages=[{id:'overview',label:'Overview',sub:'COMMAND CENTER',key:'01'},{id:'recon',label:'Recon',sub:'SIMULATED RECON',key:'02'},{id:'system',label:'System',sub:'DEVICE TELEMETRY',key:'03'},{id:'alerts',label:'Alerts',sub:'EVENT MONITOR',key:'04'},{id:'payloads',label:'Payloads',sub:'DEMO MODULES',key:'05'},{id:'settings',label:'Settings',sub:'INTERFACE CONFIG',key:'06'}];
    let current='overview',reconRunning=false,alertFilter='all',metrics={battery:null,ram:null,ramTotal:null,storage:null,storageTotal:null,network:'CHECKING',device:'Browser / WebView',os:'Android / Web browser',sdk:'—',screen:'—',connected:navigator.onLine},cpu=22,ramDemo=54,alertSeq=5,termHistory=[],termCursor=0;
    let alerts=[{id:1,type:'warning',title:'Battery telemetry initialized',desc:'Battery level is read-only. Critical thresholds are shown for demonstration.',time:'JUST NOW',ack:false},{id:2,type:'info',title:'Sandbox environment active',desc:'All recon results and payload actions are simulated. No network probing is performed.',time:'− 00:18',ack:false},{id:3,type:'critical',title:'Local event logger ready',desc:'Event queue connected to the local interface. No data is transmitted.',time:'− 01:02',ack:false}];
    const modules=[{id:'MOD-01',icon:'activity',name:'Telemetry Echo',desc:'Replays a synthetic device telemetry stream and highlights changing metrics.',tag:'READ ONLY'},{id:'MOD-02',icon:'zap',name:'HUD Glitch',desc:'Triggers a short visual glitch sequence across the demo interface.',tag:'VISUAL FX'},{id:'MOD-03',icon:'alert',name:'Alert Beacon',desc:'Creates a local sample alert to demonstrate the event workflow.',tag:'LOCAL EVENT'},{id:'MOD-04',icon:'eye',name:'Recon Replay',desc:'Plays back a fictional discovery set with sample access points and clients.',tag:'SYNTHETIC DATA'},{id:'MOD-05',icon:'memory',name:'Resource Pulse',desc:'Animates CPU and memory graphs using generated values for presentation.',tag:'SIMULATION'},{id:'MOD-06',icon:'shield',name:'Safe Mode Check',desc:'Verifies the demo sandbox status and confirms that no payload executes.',tag:'SAFE CHECK'}];
    const defaultSettings={animations:true,scanlines:true,compact:false,accent:'red'};let settings={...defaultSettings};try{settings={...settings,...JSON.parse(localStorage.getItem('dedsec-settings')||'{}')}}catch{}
    function applySettings(){document.documentElement.style.setProperty('--scan',settings.scanlines?'1':'0');document.documentElement.style.setProperty('--motion',settings.animations?'1':'0');const colors={red:['#ff244f','#b90f32'],cyan:['#66f6e7','#159f9a'],acid:['#d9ff4f','#789c12']};const c=colors[settings.accent]||colors.red;document.documentElement.style.setProperty('--red',c[0]);document.documentElement.style.setProperty('--red2',c[1]);document.body.classList.toggle('compact-mode',!!settings.compact);if(!settings.animations)document.body.classList.add('no-motion');else document.body.classList.remove('no-motion');try{localStorage.setItem('dedsec-settings',JSON.stringify(settings))}catch{}}
    applySettings();
    function renderNav(){const html=pages.map(p=>`<button class="nav-btn ${p.id===current?'active':''}" data-page="${p.id}">${icon(p.id)}<span class="nav-name">${p.label}</span><span class="nav-key">${p.key}</span></button>`).join('');$('#sideNav').innerHTML=html;$('#mobileNav').innerHTML=html;$$('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));}
    function go(id){current=id;renderNav();renderPage();$('#crumbName').textContent=pages.find(p=>p.id===id).sub;window.scrollTo({top:0,behavior:settings.animations?'smooth':'auto'});}
    const title=(eyebrow,heading,desc,button='')=>`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${heading}</h1><p class="page-subtitle">${desc}</p></div>${button}</div>`;
    const section=(name,meta='')=>`<div class="section-label">${name}${meta?` <span>${meta}</span>`:''}</div>`;
    const stat=(name,value,unit,iconName,accent,foot,bar=60,tag='LIVE')=>`<article class="stat-card" style="--accent:${accent};--glow-color:${accent}"><div class="stat-top"><span class="stat-name">${name}</span><span class="stat-icon">${icon(iconName,18)}</span></div><div class="stat-value">${value}<span class="stat-unit"> ${unit||''}</span></div><div class="stat-foot"><span>${foot}</span><span class="tiny-tag ${tag==='SIM'?'red':''}">${tag}</span></div><div class="mini-bar"><i style="--value:${bar}%;--accent:${accent}"></i></div></article>`;
    function getBatteryText(){return metrics.battery==null?'—':`${metrics.battery}%`}
    function getRamText(){return metrics.ram!=null&&metrics.ramTotal?`${Math.round(metrics.ram/1024)} / ${Math.round(metrics.ramTotal/1024)} MB`:`${ramDemo}%`}
    function chartSvg(){const points=Array.from({length:25},(_,i)=>{const y=60-Math.sin(i*.48)*14-(Math.sin(i*1.2)*7)-Math.random()*4;return `${i*4.17},${Math.max(15,Math.min(87,y)).toFixed(1)}`});const pts=points.join(' ');return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--red)" stop-opacity=".25"/><stop offset="100%" stop-color="var(--red)" stop-opacity="0"/></linearGradient></defs><polygon class="chart-area" points="0,100 ${pts} 100,100"/><polyline class="chart-line" points="${pts}"/><circle class="chart-dot" cx="100" cy="${points[24].split(',')[1]}" r="1.8"/></svg>`}
    function terminalMarkup(){return `<div class="terminal" id="terminal"><div class="terminal-bar"><i class="term-dot red"></i><i class="term-dot"></i><i class="term-dot"></i><span class="term-title">DEDSEC SHELL // LOCAL EMULATOR</span><span class="term-live">● SANDBOX</span></div><div class="terminal-output" id="termOutput" role="log" aria-live="polite"></div><form class="term-input-row" id="termForm"><span class="term-prefix">dedsec@demo:~$</span><input id="termInput" class="term-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type 'help' to list demo commands" aria-label="Команда терминала"><button class="term-send" aria-label="Выполнить команду">${icon('send',15)}</button></form></div>`}
    function overviewPage(){return `${title('SESSION 01 / LOCAL SANDBOX','Command <span class="slash">/</span> Center','Панель демонстрации устройства: телеметрия, синтетический recon, журнал событий и безопасные визуальные модули.',`<button class="action-btn" data-action="refresh">${icon('refresh',15)} REFRESH TELEMETRY</button>`)}
      <section class="hero"><div class="hero-content"><div class="hero-kicker"><i class="dot"></i> SYSTEM ONLINE / DEMO MODE</div><h2>KNOW YOUR<br><span>DIGITAL SHADOW.</span></h2><p>Локальный интерфейс мониторинга в стиле DEDSEC. Реальные read-only показатели устройства там, где доступны; все сканы и payload-сценарии — только симуляция.</p><div class="hero-actions"><button class="action-btn" data-goto="system">${icon('activity',15)} DEVICE STATUS</button><button class="action-btn ghost" data-goto="recon">${icon('eye',15)} OPEN RECON</button></div></div><div class="hero-code">D-SEC / FIELD UNIT<br>ENCRYPTION: N/A<br>SESSION: <span id="sessionId">A7F2-9C11</span></div></section>
      ${section('LIVE TELEMETRY','DEVICE READ-ONLY')}
      <div class="grid stats-grid" id="overviewStats">${stat('BATTERY',getBatteryText(),'','battery','var(--acid)','DEVICE VALUE',metrics.battery??72)}${stat('NETWORK',metrics.connected?'ONLINE':'OFFLINE','','wifi','var(--cyan)',metrics.network||'LOCAL STATUS',metrics.connected?88:8)}${stat('RAM LOAD',metrics.ram!=null&&metrics.ramTotal?`${Math.round((metrics.ramTotal-metrics.ram)/metrics.ramTotal*100)}%`:`${ramDemo}%`,'','memory','var(--red)','DEVICE / ESTIMATE',metrics.ram!=null?Math.round((metrics.ramTotal-metrics.ram)/metrics.ramTotal*100):ramDemo,'SIM')}${stat('CPU LOAD',`${cpu}%`,'','cpu','var(--amber)','ANIMATED SAMPLE',cpu,'SIM')}</div>
      ${section('ACTIVITY STREAM','LAST 60 SECONDS')}
      <div class="grid lower-grid"><section class="panel"><div class="panel-head"><div class="panel-title">${icon('activity')} RESOURCE PULSE</div><div class="panel-meta">CPU / SYNTHETIC TRACE</div></div><div class="chart-wrap" id="activityChart">${chartSvg()}</div><div class="chart-foot"><span>−60 SEC</span><span>−45 SEC</span><span>−30 SEC</span><span>−15 SEC</span><span>NOW</span></div><div class="split-line"></div><div class="kv-list"><div class="kv-row"><span>DEVICE</span><span id="kvDevice">${escapeHtml(metrics.device)}</span></div><div class="kv-row"><span>PLATFORM</span><span id="kvOS">${escapeHtml(metrics.os)}</span></div><div class="kv-row"><span>NETWORK</span><span id="kvNetwork">${escapeHtml(metrics.network)}</span></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">${icon('terminal')} LIVE TERMINAL</div><div class="panel-meta">COMMAND EMULATOR</div></div>${terminalMarkup()}</section></div><p class="footer-note">NOTE: CPU trace and recon datasets are generated for the demo. The terminal never executes Android/Linux shell commands.</p>`}
    function reconPage(){const sample=[['N0DE_GUEST','A4:2B:8C:10:22:71','2.4 GHz','−42 dBm','OPEN'],['VOID_NET_5G','B8:19:44:2A:91:03','5 GHz','−57 dBm','WPA2'],['DEMO_AP_04','02:4D:7F:91:AC:10','2.4 GHz','−68 dBm','WPA3'],['GHOST_LINK','DA:00:15:44:2B:9E','5 GHz','−73 dBm','WPA2']];return `${title('MODULE 02 / RECON','Recon <span class="slash">/</span> Lab','Демонстрация обнаружения узлов на вымышленных данных. Реальное Wi-Fi-сканирование, перехват пакетов и сетевые запросы не выполняются.',`<button class="action-btn" data-action="recon">${icon('play',15)} START DEMO SWEEP</button>`)}<div class="demo-notice"><strong>SIMULATION ONLY</strong> — результаты ниже фиктивные, созданы для демонстрации интерфейса и не отражают реальные сети поблизости.</div><section class="recon-hero"><div class="radar" id="radar"></div><div class="recon-copy"><div class="eyebrow">PASSIVE VISUALIZER / OFFLINE DATASET</div><h2 id="reconHeading">Environment ready.</h2><p id="reconDesc">Запусти демо-скан, чтобы воспроизвести анимацию радара и показать sample-узлы. Никакого радиоэфира приложение не сканирует.</p><div class="recon-stats"><div><b id="reconCount">04</b><span>SAMPLE NODES</span></div><div><b>02</b><span>DEMO CLIENTS</span></div><div><b>0</b><span>REAL SCANS</span></div></div><span class="badge green">LOCAL DATASET LOADED</span></div></section>${section('SAMPLE DISCOVERIES','FICTIONAL DATA')}<div class="table-wrap"><table class="data-table"><thead><tr><th>NETWORK / LABEL</th><th>FAKE BSSID</th><th>BAND</th><th>SIGNAL</th><th>SECURITY</th></tr></thead><tbody>${sample.map((r,i)=>`<tr><td><span style="color:${i===0?'var(--acid)':'#d7ddda'}">${r[0]}</span></td><td class="mono">${r[1]}</td><td>${r[2]}</td><td><span class="signal">${r[3]}</span></td><td><span class="badge ${r[4]==='OPEN'?'red':'green'}">${r[4]}</span></td></tr>`).join('')}</tbody></table></div><p class="footer-note">All BSSIDs and labels are fictional sample strings. They are not read from Wi-Fi hardware.</p>`}
    function systemPage(){const b=metrics.battery==null?null:metrics.battery;const usedRam=metrics.ram!=null&&metrics.ramTotal?Math.round((metrics.ramTotal-metrics.ram)/metrics.ramTotal*100):ramDemo;const storageUsed=metrics.storage!=null&&metrics.storageTotal?Math.round((metrics.storageTotal-metrics.storage)/metrics.storageTotal*100):61;return `${title('MODULE 03 / SYSTEM','Device <span class="slash">/</span> Telemetry','Мониторинг доступных показателей устройства. На Android используются системные read-only данные; неподдерживаемые значения помечаются как demo.',`<button class="action-btn" data-action="refresh">${icon('refresh',15)} REFRESH DATA</button>`)}<div class="demo-notice"><strong>READ-ONLY ACCESS</strong> — приложение не меняет системные настройки, не собирает данные в фоне и не отправляет телеметрию на сервер.</div>${section('DEVICE SNAPSHOT','LIVE WHEN SUPPORTED')}<div class="grid system-grid"><article class="info-tile"><div class="info-label">${icon('battery',14)} &nbsp; BATTERY</div><div class="info-value" id="sysBattery">${b==null?'UNAVAILABLE':b+'%'}</div><div class="info-detail" id="batteryDetail">${b==null?'Browser API not available':'Device battery level'}</div><div class="meter green"><span style="width:${b??0}%" id="batteryMeter"></span></div></article><article class="info-tile"><div class="info-label">${icon('memory',14)} &nbsp; RAM</div><div class="info-value" id="sysRam">${metrics.ram!=null&&metrics.ramTotal?`${Math.round((metrics.ramTotal-metrics.ram)/1024)} MB`:'DEMO'}</div><div class="info-detail" id="ramDetail">${metrics.ramTotal?`of ${Math.round(metrics.ramTotal/1024)} MB total`:'Live RAM unavailable in browser'}</div><div class="meter"><span style="width:${usedRam}%" id="ramMeter"></span></div></article><article class="info-tile"><div class="info-label">${icon('harddrive',14)} &nbsp; STORAGE</div><div class="info-value" id="sysStorage">${metrics.storageTotal?`${metrics.storageFree??0} GB free`:'DEMO'}</div><div class="info-detail" id="storageDetail">${metrics.storageTotal?`of ${metrics.storageTotal} GB total`:'Storage details unavailable'}</div><div class="meter cyan"><span style="width:${storageUsed}%" id="storageMeter"></span></div></article><article class="info-tile"><div class="info-label">${icon('cpu',14)} &nbsp; CPU LOAD</div><div class="info-value" id="sysCpu">${cpu}%</div><div class="info-detail">Animated sample — not a kernel CPU reading</div><div class="meter"><span style="width:${cpu}%" id="cpuMeter"></span></div></article><article class="info-tile"><div class="info-label">${icon('wifi',14)} &nbsp; NETWORK</div><div class="info-value" id="sysNetwork">${escapeHtml(metrics.network)}</div><div class="info-detail" id="networkDetail">${metrics.connected?'Connection available':'No active connection detected'}</div><div class="meter green"><span style="width:${metrics.connected?82:4}%" id="networkMeter"></span></div></article><article class="info-tile"><div class="info-label">${icon('activity',14)} &nbsp; SCREEN</div><div class="info-value" id="sysScreen">${escapeHtml(metrics.screen||`${screen.width} × ${screen.height}`)}</div><div class="info-detail">CSS viewport / device display</div><div class="meter cyan"><span style="width:74%"></span></div></article></div>${section('PLATFORM DETAILS','LOCAL ONLY')}<section class="panel"><div class="kv-list"><div class="kv-row"><span>DEVICE MODEL</span><span id="detailDevice">${escapeHtml(metrics.device)}</span></div><div class="kv-row"><span>MANUFACTURER / OS</span><span id="detailOS">${escapeHtml(metrics.os)}</span></div><div class="kv-row"><span>ANDROID API</span><span id="detailSDK">${escapeHtml(metrics.sdk)}</span></div><div class="kv-row"><span>USER AGENT</span><span id="detailUA">${escapeHtml(navigator.userAgent.slice(0,120))}</span></div><div class="kv-row"><span>APP MODE</span><span>LOCAL DEMO / READ-ONLY</span></div></div></section><p class="footer-note">Обновление метрик выполняется только пока экран приложения открыт. CPU-график — синтетический визуальный индикатор.</p>`}
    function alertIcon(type){return type==='critical'?'alert':type==='warning'?'alert':'activity'}
    function alertsPage(){const filtered=alerts.filter(a=>alertFilter==='all'||(alertFilter==='active'?!a.ack: a.type===alertFilter));return `${title('MODULE 04 / EVENTS','Alerts <span class="slash">/</span> Monitor','Локальный журнал событий и демонстрационных уведомлений. Можно подтверждать, фильтровать и создавать sample-alerts.',`<button class="action-btn" data-action="new-alert">${icon('plus',15)} CREATE DEMO ALERT</button>`)}${section('EVENT QUEUE',`${alerts.filter(a=>!a.ack).length} UNACKNOWLEDGED`)}<div class="filter-row">${[['all','ALL EVENTS'],['active','ACTIVE'],['critical','CRITICAL'],['warning','WARNING'],['info','INFO']].map(([v,l])=>`<button class="filter-btn ${alertFilter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div><div class="alerts-list">${filtered.length?filtered.map(a=>`<article class="alert-card ${a.ack?'ack':''}"><div class="alert-icon ${a.type==='warning'?'warning':a.type==='info'?'info':''}">${icon(alertIcon(a.type),18)}</div><div><div class="alert-title">${escapeHtml(a.title)} ${a.ack?'<span class="badge">ACKNOWLEDGED</span>':''}</div><div class="alert-desc">${escapeHtml(a.desc)}</div><div class="alert-time">${a.type.toUpperCase()} &nbsp; / &nbsp; ${a.time}</div></div><div class="alert-actions">${!a.ack?`<button class="mini-btn" data-ack="${a.id}">ACK</button>`:''}<button class="mini-btn" data-dismiss="${a.id}" aria-label="Удалить уведомление">${icon('x',12)}</button></div></article>`).join(''):'<div class="panel" style="text-align:center;color:#7b8581;padding:32px">No events in this filter.</div>'}</div><p class="footer-note">События сохраняются только в памяти текущей сессии и не отправляются на сервер.</p>`}
    function payloadsPage(){return `${title('MODULE 05 / SIMULATIONS','Payloads <span class="slash">/</span> Lab','Визуальные демо-модули для презентации интерфейса. Здесь нет exploit-кода, командной оболочки или действий над устройством.',`<button class="action-btn ghost" data-action="safe-check">${icon('shield',15)} VERIFY SAFE MODE</button>`)}<div class="demo-notice"><strong>SAFE DEMO</strong> — каждая кнопка запускает только локальную анимацию или создаёт тестовую запись. Никаких реальных payloads не выполняется.</div>${section('AVAILABLE MODULES','6 VISUAL SCENARIOS')}<div class="grid content-grid">${modules.map(m=>`<article class="module-card"><div class="module-top"><div class="module-icon">${icon(m.icon,20)}</div><span class="badge">${m.tag}</span></div><h3>${m.name}</h3><p>${m.desc}</p><div class="module-foot"><span class="module-id">${m.id}</span><button class="action-btn small ghost" data-module="${m.id}">RUN DEMO ${icon('arrow',12)}</button></div></article>`).join('')}</div><div class="section-label">EXECUTION LOG <span>LOCAL VISUAL ONLY</span></div><section class="panel"><div class="kv-list" id="payloadLog"><div class="kv-row"><span>READY</span><span>All modules idle. Select RUN DEMO to start.</span></div></div></section>`}
    function settingsPage(){return `${title('MODULE 06 / CONFIG','Settings <span class="slash">/</span> Interface','Настрой внешний вид демонстрации. Настройки сохраняются локально на этом устройстве.',`<button class="action-btn neutral" data-action="reset-settings">${icon('refresh',15)} RESET DEFAULTS</button>`)}${section('VISUAL INTERFACE','PREFERENCES')}<section class="panel"><div class="settings-list"><div class="setting-row"><div><div class="setting-name">Glitch & UI animations</div><div class="setting-desc">Включает анимацию загрузки, переходы и визуальные эффекты.</div></div><button class="switch ${settings.animations?'on':''}" data-setting="animations" aria-label="Анимации"></button></div><div class="setting-row"><div><div class="setting-name">CRT scanlines</div><div class="setting-desc">Тонкие линии сканирования поверх интерфейса в стиле терминала.</div></div><button class="switch ${settings.scanlines?'on':''}" data-setting="scanlines" aria-label="Scanlines"></button></div><div class="setting-row"><div><div class="setting-name">Compact mode</div><div class="setting-desc">Оптимизирует визуальную плотность карточек и панелей.</div></div><button class="switch ${settings.compact?'on':''}" data-setting="compact" aria-label="Компактный режим"></button></div><div class="setting-row"><div><div class="setting-name">Accent color</div><div class="setting-desc">Измени цвет подсветки без перезагрузки интерфейса.</div></div><div class="accent-options"><button class="accent-chip ${settings.accent==='red'?'active':''}" style="--chip:#ff244f" data-accent="red" aria-label="Красный"></button><button class="accent-chip ${settings.accent==='cyan'?'active':''}" style="--chip:#66f6e7" data-accent="cyan" aria-label="Бирюзовый"></button><button class="accent-chip ${settings.accent==='acid'?'active':''}" style="--chip:#d9ff4f" data-accent="acid" aria-label="Лаймовый"></button></div></div></div></section>${section('LOCAL DATA','SESSION CONTROLS')}<section class="panel"><div class="kv-list"><div class="kv-row"><span>STORAGE</span><span>localStorage / browser sandbox</span></div><div class="kv-row"><span>NETWORK UPLOADS</span><span style="color:var(--acid)">NONE</span></div><div class="kv-row"><span>REAL PAYLOAD EXECUTION</span><span style="color:var(--acid)">DISABLED</span></div><div class="kv-row"><span>MIN ANDROID API</span><span>24 (Android 7.0)</span></div></div><div class="split-line"></div><button class="action-btn ghost" data-action="clear-logs">${icon('trash',14)} CLEAR LOCAL DEMO LOGS</button> <button class="action-btn neutral" data-action="reset-demo">RESET DEMO SESSION</button></section><p class="footer-note">DEDSEC Demo Terminal is a fan-made visual demo. It is not affiliated with any security organization or device vendor.</p>`}
    function renderPage(){const html={overview:overviewPage,recon:reconPage,system:systemPage,alerts:alertsPage,payloads:payloadsPage,settings:settingsPage}[current]();$('#page').innerHTML=html;bindPage();if(current==='overview'){renderTerminal();updateOverviewMetrics()}if(current==='system')updateSystemMetrics();}
    function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function toast(title,msg,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.innerHTML=`<b>${escapeHtml(title)}</b><span>${escapeHtml(msg)}</span>`;$('#toasts').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(10px)';setTimeout(()=>el.remove(),250)},3200)}
    function logTerm(text,type=''){termHistory.push({text,type});if(termHistory.length>120)termHistory.shift();const out=$('#termOutput');if(out){out.innerHTML=termHistory.map(l=>`<div class="term-line ${l.type}">${l.text}</div>`).join('');out.scrollTop=out.scrollHeight}}
    function initTerm(){termHistory=[{text:'DEDSEC LOCAL SHELL // build 0.9.24',type:'good'},{text:'Sandbox connected. No system shell access.',type:'dim'},{text:'Type <span class="good">help</span> to list supported demo commands.',type:''}]}
    function renderTerminal(){if(!termHistory.length)initTerm();const out=$('#termOutput');if(out){out.innerHTML=termHistory.map(l=>`<div class="term-line ${l.type}">${l.text}</div>`).join('');out.scrollTop=out.scrollHeight}const form=$('#termForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();const input=$('#termInput');const cmd=input.value.trim();if(!cmd)return;logTerm(`<span class="prompt">dedsec@demo:~$</span> ${escapeHtml(cmd)}`);input.value='';runCommand(cmd)});}
    function runCommand(command){const cmd=command.toLowerCase().trim();const [base,...args]=cmd.split(/\s+/);const out=(s,t='')=>logTerm(s,t);switch(base){case'help':out('COMMANDS: help · clear · status · sysinfo · network · recon --demo · alerts · payloads · date · whoami · ping demo','good');out('This is a command emulator. Arbitrary shell commands are not executed.','dim');break;case'clear':termHistory=[];const o=$('#termOutput');if(o)o.innerHTML='';break;case'status':out(`SYSTEM: ONLINE / DEMO · BATTERY: ${metrics.battery==null?'N/A':metrics.battery+'%'} · NETWORK: ${metrics.connected?'ONLINE':'OFFLINE'}`,'good');out('CPU value is simulated.','dim');break;case'sysinfo':out(`DEVICE: ${escapeHtml(metrics.device)} · PLATFORM: ${escapeHtml(metrics.os)} · VIEWPORT: ${screen.width}x${screen.height}`);if(metrics.sdk!=='—')out(`ANDROID API: ${escapeHtml(metrics.sdk)}`,'dim');break;case'network':out(`LINK: ${metrics.connected?'CONNECTED':'OFFLINE'} · TYPE: ${escapeHtml(metrics.network)}`,'good');out('No packets are captured or transmitted by this command.','dim');break;case'recon':if(args[0]==='--demo'){go('recon');setTimeout(()=>startRecon(),150);out('Loading fictional dataset in Recon module…','good')}else out('Usage: recon --demo  (fictional data only)','warn');break;case'alerts':go('alerts');out('Opening local event monitor…','good');break;case'payloads':go('payloads');out('Opening safe visual modules…','good');break;case'date':out(new Date().toString());break;case'whoami':out('dedsec-demo / local-user / sandbox','good');break;case'ping':if(args[0]==='demo'){out('PING demo.local: visual simulation, 3 replies (12ms / 18ms / 14ms)','good');out('0% loss · generated output · no network request sent','dim')}else out('Only `ping demo` is supported; no network packets are sent.','warn');break;default:out(`Command not found: ${escapeHtml(base)}. Type help.`, 'warn')}}
    function updateOverviewMetrics(){if(current!=='overview')return;const st=$('#overviewStats');if(st)st.innerHTML=`${stat('BATTERY',getBatteryText(),'','battery','var(--acid)',metrics.battery==null?'BROWSER LIMITATION':'DEVICE VALUE',metrics.battery??72)}${stat('NETWORK',metrics.connected?'ONLINE':'OFFLINE','','wifi','var(--cyan)',metrics.network||'CONNECTION STATE',metrics.connected?88:8)}${stat('RAM LOAD',metrics.ram!=null&&metrics.ramTotal?`${Math.round((metrics.ramTotal-metrics.ram)/metrics.ramTotal*100)}%`:`${ramDemo}%`,'','memory','var(--red)',metrics.ram!=null?'DEVICE VALUE':'ESTIMATE',metrics.ram!=null?Math.round((metrics.ramTotal-metrics.ram)/metrics.ramTotal*100):ramDemo,metrics.ram!=null?'LIVE':'SIM')}${stat('CPU LOAD',`${cpu}%`,'','cpu','var(--amber)','ANIMATED SAMPLE',cpu,'SIM')}`;const d=$('#kvDevice');if(d)d.textContent=metrics.device;const os=$('#kvOS');if(os)os.textContent=metrics.os;const nw=$('#kvNetwork');if(nw)nw.textContent=metrics.network;}
    function updateSystemMetrics(){if(current!=='system')return;const put=(id,val)=>{const e=$(id);if(e)e.textContent=val};const width=(id,v)=>{const e=$(id);if(e)e.style.width=`${Math.max(0,Math.min(100,v))}%`};put('#sysBattery',metrics.battery==null?'UNAVAILABLE':metrics.battery+'%');put('#batteryDetail',metrics.battery==null?'Browser API not available':'Device battery level / read-only');width('#batteryMeter',metrics.battery??0);put('#sysRam',metrics.ram!=null&&metrics.ramTotal?`${Math.round((metrics.ramTotal-metrics.ram)/1024)} MB`:'DEMO');put('#ramDetail',metrics.ramTotal?`of ${Math.round(metrics.ramTotal/1024)} MB total`:'Live RAM unavailable in browser');const used=metrics.ram!=null&&metrics.ramTotal?Math.round((metrics.ramTotal-metrics.ram)/metrics.ramTotal*100):ramDemo;width('#ramMeter',used);put('#sysStorage',metrics.storageTotal?`${metrics.storageFree} GB free`:'DEMO');put('#storageDetail',metrics.storageTotal?`of ${metrics.storageTotal} GB total`:'Storage details unavailable');width('#storageMeter',metrics.storageTotal?100-(metrics.storageFree/metrics.storageTotal*100):61);put('#sysCpu',cpu+'%');width('#cpuMeter',cpu);put('#sysNetwork',metrics.network);put('#networkDetail',metrics.connected?'Connection available':'No active connection detected');width('#networkMeter',metrics.connected?82:4);put('#sysScreen',metrics.screen||`${screen.width} × ${screen.height}`);put('#detailDevice',metrics.device);put('#detailOS',metrics.os);put('#detailSDK',metrics.sdk);put('#detailUA',navigator.userAgent.slice(0,120));}
    function refreshMetrics(){try{if(window.DeviceBridge&&typeof DeviceBridge.getDeviceInfoJson==='function'){const d=JSON.parse(DeviceBridge.getDeviceInfoJson());metrics.battery=Number.isFinite(d.batteryPercent)&&d.batteryPercent>=0?d.batteryPercent:metrics.battery;metrics.ram=Number.isFinite(d.ramAvailableMb)?d.ramAvailableMb*1:metrics.ram;metrics.ramTotal=Number.isFinite(d.ramTotalMb)?d.ramTotalMb*1:metrics.ramTotal;metrics.storageFree=Number.isFinite(d.storageFreeGb)?d.storageFreeGb:metrics.storageFree;metrics.storageTotal=Number.isFinite(d.storageTotalGb)?d.storageTotalGb:metrics.storageTotal;metrics.network=d.networkType||metrics.network;metrics.connected=!!d.connected;metrics.device=[d.manufacturer,d.model].filter(Boolean).join(' ')||metrics.device;metrics.os=d.androidVersion?`Android ${d.androidVersion}`:metrics.os;metrics.sdk=d.sdkInt?`API ${d.sdkInt}`:metrics.sdk;}else{metrics.connected=navigator.onLine;metrics.network=navigator.onLine?((navigator.connection&&navigator.connection.effectiveType)||'ONLINE'):'OFFLINE';metrics.device=/Android/i.test(navigator.userAgent)?'Android device / WebView':'Browser / Web demo';metrics.os=/Android\s([\d.]+)/i.test(navigator.userAgent)?`Android ${RegExp.$1}`:'Browser environment';metrics.screen=`${screen.width} × ${screen.height}`;if(navigator.deviceMemory)metrics.ramTotal=navigator.deviceMemory*1024;}}catch(e){metrics.connected=navigator.onLine;metrics.network=navigator.onLine?'ONLINE':'OFFLINE'}updateOverviewMetrics();updateSystemMetrics();const s=$('#connectionStatus');if(s)s.textContent=metrics.connected?'SYSTEM READY':'OFFLINE MODE';}
    function startRecon(){if(current!=='recon')go('recon');const radar=$('#radar');if(radar)radar.classList.add('scanning');const h=$('#reconHeading'),d=$('#reconDesc'),c=$('#reconCount');if(h)h.textContent='Running demo sweep…';if(d)d.textContent='Воспроизводится локальная анимация; список результатов — заранее подготовленные фиктивные данные.';if(c)c.textContent='…';toast('RECON SIMULATION','Fictional dataset only. No radio scan performed.');setTimeout(()=>{const r=$('#radar');if(r)r.classList.remove('scanning');const hh=$('#reconHeading'),dd=$('#reconDesc'),cc=$('#reconCount');if(hh)hh.textContent='Demo sweep complete.';if(dd)dd.textContent='Набор вымышленных узлов загружен. Реальные сети и устройства не обнаруживались.';if(cc)cc.textContent='04';addAlert('info','Demo recon sweep complete','Four fictional sample nodes were displayed. No actual network scan occurred.');},2400)}
    function addAlert(type,titleText,desc){alerts.unshift({id:++alertSeq,type,title:titleText,desc,time:'JUST NOW',ack:false});if(alerts.length>40)alerts.pop();}
    function runModule(id){const m=modules.find(x=>x.id===id);if(!m)return;const logs=$('#payloadLog');const entry=document.createElement('div');entry.className='kv-row';entry.innerHTML=`<span>${new Date().toLocaleTimeString()} / ${m.id}</span><span>${escapeHtml(m.name)} — <span style="color:var(--acid)">SIMULATED</span></span>`;if(logs)logs.prepend(entry);switch(id){case'MOD-01':cpu=Math.floor(18+Math.random()*58);ramDemo=Math.floor(35+Math.random()*40);refreshMetrics();toast('TELEMETRY ECHO','Synthetic metrics stream replayed.');break;case'MOD-02':document.body.animate([{transform:'translateX(0)'},{transform:'translateX(2px)'},{transform:'translateX(-2px)'},{transform:'translateX(0)'}],{duration:280,iterations:2});toast('HUD GLITCH','Visual-only effect triggered.');break;case'MOD-03':addAlert('warning','Demo beacon triggered','A sample alert was generated locally by the Alert Beacon module.');toast('ALERT BEACON','Sample alert added to event queue.');break;case'MOD-04':toast('RECON REPLAY','Opening fictional recon dataset.');go('recon');break;case'MOD-05':cpu=Math.floor(15+Math.random()*70);ramDemo=Math.floor(30+Math.random()*55);refreshMetrics();toast('RESOURCE PULSE','Synthetic chart values refreshed.');break;case'MOD-06':toast('SAFE MODE VERIFIED','No command execution, network scanning or payload action is enabled.');addAlert('info','Safe mode verification passed','Demo modules are visual-only and do not execute system commands.');break}}
    function bindPage(){ $$('[data-goto]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.goto)));$$('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{alertFilter=b.dataset.filter;renderPage()}));$$('[data-ack]').forEach(b=>b.addEventListener('click',()=>{const a=alerts.find(a=>a.id===Number(b.dataset.ack));if(a)a.ack=true;renderPage();toast('EVENT ACKNOWLEDGED','Alert marked as reviewed.')}));$$('[data-dismiss]').forEach(b=>b.addEventListener('click',()=>{alerts=alerts.filter(a=>a.id!==Number(b.dataset.dismiss));renderPage()}));$$('[data-module]').forEach(b=>b.addEventListener('click',()=>runModule(b.dataset.module)));$$('[data-setting]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.setting;settings[k]=!settings[k];applySettings();renderPage()}));$$('[data-accent]').forEach(b=>b.addEventListener('click',()=>{settings.accent=b.dataset.accent;applySettings();renderPage()}));}
    function action(name){switch(name){case'refresh':refreshMetrics();cpu=Math.max(7,Math.min(94,cpu+Math.round((Math.random()-.5)*18)));ramDemo=Math.max(20,Math.min(89,ramDemo+Math.round((Math.random()-.5)*12)));if($('#activityChart'))$('#activityChart').innerHTML=chartSvg();updateOverviewMetrics();updateSystemMetrics();toast('TELEMETRY UPDATED','Available read-only values refreshed.');break;case'recon':startRecon();break;case'new-alert':addAlert('warning','Manual demo alert','This is a locally generated sample alert.');renderPage();toast('ALERT CREATED','A sample event was added to the local queue.');break;case'safe-check':toast('SAFE MODE VERIFIED','All modules are visual-only. No shell or exploit code runs.');addAlert('info','Safe mode verification passed','Manual verification completed in the demo UI.');break;case'reset-settings':settings={...defaultSettings};applySettings();renderPage();toast('SETTINGS RESET','Default interface settings restored.');break;case'clear-logs':termHistory=[];alerts=[];renderPage();toast('LOCAL LOGS CLEARED','Demo event and terminal logs cleared.');break;case'reset-demo':alerts=[];alertSeq=0;cpu=22;ramDemo=54;termHistory=[];initTerm();refreshMetrics();go('overview');toast('SESSION RESET','Demo state has been reset.');break}}
    $('#quickTerminal').addEventListener('click',()=>{if(current!=='overview')go('overview');setTimeout(()=>$('#termInput')?.focus(),80)});
    function tickClock(){$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false});}
    window.addEventListener('online',()=>{metrics.connected=true;metrics.network='ONLINE';refreshMetrics();toast('NETWORK STATUS','Connection is available.')});window.addEventListener('offline',()=>{metrics.connected=false;metrics.network='OFFLINE';refreshMetrics();toast('OFFLINE MODE','App remains available locally.')});
    renderNav();initTerm();renderPage();refreshMetrics();tickClock();setInterval(tickClock,1000);setInterval(()=>{cpu=Math.max(8,Math.min(91,cpu+Math.round((Math.random()-.5)*14)));ramDemo=Math.max(23,Math.min(88,ramDemo+Math.round((Math.random()-.5)*6)));refreshMetrics();if(current==='overview'){$('#activityChart')&&($('#activityChart').innerHTML=chartSvg())}},4200);setInterval(refreshMetrics,5000);
    setTimeout(()=>$('#boot').classList.add('done'),settings.animations?1350:250);
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
  })();
  </script>
</body>
