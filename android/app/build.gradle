plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dedsec.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dedsec.demo'
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName '0.9.24'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
